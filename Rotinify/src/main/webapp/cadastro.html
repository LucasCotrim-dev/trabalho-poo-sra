<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Rotinify - Cadastro</title>
</head>
<body>

    <div class="container">
        <div class="left-half">
            <img class="logo" src="images/Logo.svg" alt="Image 1">
            <img class="imgLogin" src="images/imgLogin.svg" alt="Image 2">
        </div>
        <div class="right-half">
            <form action="/submit" method="post">
                <h1>Cadastro</h1>

                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" required>
            
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>

                <p>Já possui uma conta? <a href="main">Clique aqui</a></p>

                <button class="cadastrar-button" type="submit"> Cadastrar</button>

                <div class="or-line">
                    <span>ou</span>
                </div>

                <div class="social-buttons">
                    <button class="google-button" type="button">
                        <img src="Google.svg" alt="Google Logo">
                    </button>
                    <button class="facebook-button" type="button">
                        <img src="Facebook.svg" alt="Facebook Logo">
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
